# TeslaCharger su un sottodominio dedicato. I blocchi HTTPS li aggiunge certbot:
# questo file è il modello, quello vivo sta in /etc/nginx/sites-available/teslacharger.
server {
    listen 80;
    listen [::]:80;
    server_name tesla.example.com;

    root /var/www/teslacharger;
    autoindex off;
    server_tokens off;

    # Tutto il sito richiede la password, tranne la chiave pubblica che Tesla deve poter leggere
    auth_basic "TeslaCharger";
    auth_basic_user_file /etc/nginx/teslacharger.htpasswd;

    location /.well-known/appspecific/ {
        auth_basic off;
        default_type application/x-pem-file;
        try_files $uri =404;
    }

    # Pagina di ritorno dell'autorizzazione Tesla
    location = /auth/callback {
        default_type text/html;
        try_files /callback.html =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    access_log /var/log/nginx/teslacharger.access.log;
    error_log  /var/log/nginx/teslacharger.error.log;
}
