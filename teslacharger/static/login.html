<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TeslaCharger">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>TeslaCharger</title>
<style>
  :root { --bg: #f4f1ea; --card: #fffdf8; --ink: #1d2226; --muted: #6b7278; --line: #e2ddd2; --warn: #b3541e; --sun: #c9820a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171a; --card: #1d2226; --ink: #ecebe6; --muted: #979da3; --line: #2c3338; --warn: #f09a5e; --sun: #f0b23e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: grid; gap: 14px; }
  h1 { font-size: 1.2rem; margin: 0; }
  label { font-size: .85rem; color: var(--muted); }
  input, button { font: inherit; padding: 12px; border-radius: 12px; border: 1px solid var(--line); min-height: 48px; width: 100%; }
  input { background: var(--bg); color: var(--ink); }
  button { background: var(--ink); color: var(--card); font-weight: 600; cursor: pointer; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  #msg { color: var(--warn); font-size: .9rem; margin: 0; min-height: 1.3em; }
</style>
</head>
<body>
<form id="f">
  <h1>TeslaCharger</h1>
  <div>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" required autofocus>
  </div>
  <button>Entra</button>
  <p id="msg" role="alert"></p>
</form>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: document.getElementById("p").value }) });
  if (r.ok) location.replace("/");
  else document.getElementById("msg").textContent = r.status === 429 ? "Troppi tentativi, riprova tra qualche minuto." : "Password non corretta.";
});
</script>
</body>
</html>
