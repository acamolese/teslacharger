<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Accesso a TeslaCharger</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap">
<style>
body{margin:0}
a{color:#3b3b3b}a:hover{color:#000000}
.lg{--p:#111111;--onp:#f5f5f5;--pc:#d9d9d9;--onpc:#1b1b1b;--sf:#f9f9f9;--onsf:#1b1b1b;--onsfv:#474747;--ol:#777777;--olv:#c6c6c6;--e:#ba1a1a;--sch:#e8e8e8;--sc:#e2e2e2;--onsc:#1b1b1b;
--silver:linear-gradient(135deg,#f4f4f4 0%,#cfcfcf 34%,#e9e9e9 52%,#b9b9b9 78%,#dedede 100%);--gloss:linear-gradient(160deg,#3a3a3a 0%,#0c0c0c 38%,#000000 62%,#262626 100%);
--sp-fast:linear(0,.033,.119,.236,.369,.504,.634,.75,.849,.931,.993,1.039,1.07,1.087,1.094,1.093,1.087,1.077,1.064,1.052,1.039,1.028,1.018,1.009,1.003,.998,.994,.992,.991,.991,.991,.992,.993,.995,.996,.997,1);
--sp-def:linear(0,.022,.078,.156,.246,.34,.433,.522,.604,.678,.744,.8,.848,.887,.92,.946,.967,.982,.994,1.003,1.008,1.012,1.014,1.015,1.015,1.014,1.013,1.012,1.011,1.009,1.008,1.007,1.005,1.004,1.003,1.003,1);
--sh-sunny:polygon(50.0% 0.0%,56.3% 2.0%,61.7% 6.4%,66.6% 9.9%,72.5% 10.9%,79.4% 11.6%,85.4% 14.6%,88.4% 20.6%,89.1% 27.5%,90.1% 33.4%,93.6% 38.3%,98.0% 43.7%,100.0% 50.0%,98.0% 56.3%,93.6% 61.7%,90.1% 66.6%,89.1% 72.5%,88.4% 79.4%,85.4% 85.4%,79.4% 88.4%,72.5% 89.1%,66.6% 90.1%,61.7% 93.6%,56.3% 98.0%,50.0% 100.0%,43.7% 98.0%,38.3% 93.6%,33.4% 90.1%,27.5% 89.1%,20.6% 88.4%,14.6% 85.4%,11.6% 79.4%,10.9% 72.5%,9.9% 66.6%,6.4% 61.7%,2.0% 56.3%,0.0% 50.0%,2.0% 43.7%,6.4% 38.3%,9.9% 33.4%,10.9% 27.5%,11.6% 20.6%,14.6% 14.6%,20.6% 11.6%,27.5% 10.9%,33.4% 9.9%,38.3% 6.4%,43.7% 2.0%);
--sh-burst:polygon(50.0% 0.0%,55.8% 5.7%,60.2% 12.1%,67.1% 8.8%,75.0% 6.7%,77.2% 14.6%,77.8% 22.2%,85.4% 22.8%,93.3% 25.0%,91.2% 32.9%,87.9% 39.8%,94.3% 44.2%,100.0% 50.0%,94.3% 55.8%,87.9% 60.2%,91.2% 67.1%,93.3% 75.0%,85.4% 77.2%,77.8% 77.8%,77.2% 85.4%,75.0% 93.3%,67.1% 91.2%,60.2% 87.9%,55.8% 94.3%,50.0% 100.0%,44.2% 94.3%,39.8% 87.9%,32.9% 91.2%,25.0% 93.3%,22.8% 85.4%,22.2% 77.8%,14.6% 77.2%,6.7% 75.0%,8.8% 67.1%,12.1% 60.2%,5.7% 55.8%,0.0% 50.0%,5.7% 44.2%,12.1% 39.8%,8.8% 32.9%,6.7% 25.0%,14.6% 22.8%,22.2% 22.2%,22.8% 14.6%,25.0% 6.7%,32.9% 8.8%,39.8% 12.1%,44.2% 5.7%)}
.lg.dark{--p:#ededed;--onp:#111111;--pc:#2e2e2e;--onpc:#f1f1f1;--sf:#0e0e0e;--onsf:#e2e2e2;--onsfv:#c6c6c6;--ol:#919191;--olv:#3f3f3f;--e:#ffb4ab;--sch:#242424;--sc:#3d3d3d;--onsc:#e2e2e2;
--silver:linear-gradient(135deg,#5a5a5a 0%,#2c2c2c 34%,#474747 52%,#232323 78%,#3c3c3c 100%);--gloss:linear-gradient(160deg,#f6f6f6 0%,#cfcfcf 40%,#e8e8e8 58%,#b4b4b4 100%)}
.lg{width:390px;height:844px;box-sizing:border-box;background:var(--sf);color:var(--onsf);font-family:'Roboto Flex',system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;padding:96px 24px 32px;gap:0}
.lg *{box-sizing:border-box}
.ic{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-feature-settings:'liga';font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;display:inline-block;user-select:none}
.mark{width:120px;height:120px;animation:spin 30s linear infinite}
.mark-s{width:100%;height:100%;clip-path:var(--sh-sunny);background:var(--gloss);color:var(--onp);display:grid;place-items:center;animation:markIn 900ms var(--sp-fast) both}
.mark-s .ic{font-size:52px;font-variation-settings:'FILL' 1,'wght' 600,'GRAD' 0,'opsz' 48;animation:spin 30s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes markIn{from{clip-path:var(--sh-burst);transform:scale(.4)}to{clip-path:var(--sh-sunny);transform:none}}
.rise{animation:rise 700ms var(--sp-def) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.field{position:relative;height:56px;border:1px solid var(--ol);border-radius:8px;transition:border-color 150ms;display:flex;align-items:center}
.field:focus-within{border:2px solid var(--p)}
.field.err{border:2px solid var(--e)}
.field input{flex:1;height:100%;border:0;outline:0;background:transparent;color:var(--onsf);font:inherit;font-size:16px;padding:0 0 0 16px;letter-spacing:.5px}
.field label{position:absolute;left:12px;top:50%;padding:0 4px;background:var(--sf);color:var(--onsfv);font-size:16px;transform:translateY(-50%);transform-origin:left center;transition:top 300ms var(--sp-def),transform 300ms var(--sp-def),color 150ms;pointer-events:none}
.field.up label,.field:focus-within label{top:0;transform:translateY(-50%) scale(.75)}
.field:focus-within label{color:var(--p)}
.field.err label{color:var(--e)}
.eye{width:48px;height:48px;border:0;background:none;color:var(--onsfv);border-radius:24px;display:grid;place-items:center;cursor:pointer;margin-right:4px}
.eye:hover{background:color-mix(in srgb,var(--onsfv) 8%,transparent)}
.help{font-size:12px;line-height:16px;padding:4px 16px 0;color:var(--onsfv)}
.help.err{color:var(--e)}
.btn{height:56px;border-radius:28px;background:var(--gloss);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 6px rgba(0,0,0,.22);color:var(--onp);display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600;text-decoration:none;transition:border-radius 350ms var(--sp-fast)}
.btn:active{border-radius:16px}
.btn:hover{color:var(--onp);filter:brightness(1.06)}
.btn:focus-visible{outline:3px solid var(--onsc);outline-offset:2px}
</style>
</helmet>
<main class="lg {{themeCls}}">
  <div class="mark" aria-hidden="true"><div class="mark-s"><span class="ic">bolt</span></div></div>
  <h1 class="rise" style="margin: 40px 0 8px; font-size: 45px; line-height: 52px; font-weight: 600; font-variation-settings: 'wdth' 110; animation-delay: 120ms">TeslaCharger</h1>
  <p class="rise" style="margin: 0; font-size: 16px; line-height: 24px; color: var(--onsfv); animation-delay: 180ms">La ricarica di casa della Model 3, col sole di giorno e con Octopus di notte.</p>

  <form class="rise" style="margin-top: 48px; display: flex; flex-direction: column; gap: 24px; animation-delay: 240ms" onSubmit="{{noop}}">
    <div>
      <div class="field {{fieldCls}}">
        <label for="pw">Password</label>
        <input id="pw" type="{{pwType}}" value="{{pw}}" onChange="{{onPw}}" autocomplete="current-password" aria-describedby="pw-h" aria-invalid="{{invalid}}">
        <button type="button" class="eye" onClick="{{toggle}}" aria-label="{{eyeLabel}}"><span class="ic" style="font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24">{{eyeIcon}}</span></button>
      </div>
      <div id="pw-h" class="help {{helpCls}}">{{help}}</div>
    </div>
    <a class="btn" href="Main.dc.html"><span class="ic" style="font-size: 20px">login</span>Entra</a>
  </form>

  <p style="margin: auto 0 0; display: flex; gap: 8px; align-items: center; font-size: 12px; line-height: 16px; color: var(--onsfv)"><span class="ic" style="font-size: 18px" aria-hidden="true">devices</span>Uso personale: un solo account, il proprietario dell'auto.</p>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"errore":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var self = this;
    this.state = { pw: props.errore ? 'sole2026' : '', show: false };
    this.onPw = function (e) { self.setState({ pw: e.target.value }); };
    this.toggle = function () { self.setState({ show: !self.state.show }); };
    this.noop = function (e) { e.preventDefault(); };
  }
  renderVals() {
    var s = this.state, err = !!this.props.errore;
    return {
      themeCls: this.props.dark ? 'dark' : '',
      pw: s.pw, onPw: this.onPw, toggle: this.toggle, noop: this.noop,
      pwType: s.show ? 'text' : 'password', eyeIcon: s.show ? 'visibility_off' : 'visibility', eyeLabel: s.show ? 'Nascondi password' : 'Mostra password',
      fieldCls: (s.pw ? 'up ' : '') + (err ? 'err' : ''), invalid: err ? 'true' : 'false',
      helpCls: err ? 'err' : '', help: err ? 'Password non corretta. Riprova.' : 'Questo dispositivo resterà collegato per un anno.'
    };
  }
}
</script>
</body>
</html>
